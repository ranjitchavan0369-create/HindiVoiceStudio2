
name: Build Hindi Voice Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract starter project
        run: |
          unzip -o HindiVoiceStudio_starter_project.zip -d .
          test -f app/build.gradle

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiVoiceStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk.   
- name: Run Playwright Tests
  run: npm run test:e2e

- name: Upload Test Screenshots if Failed
  if: failure() # 👈 This only runs if the step above crashes
  uses: actions/upload-artifact@v4
  with:
    name: playwright-debug-screenshots
    path: playwright-report/
    
          












